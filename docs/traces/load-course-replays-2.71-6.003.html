          tooltip.style.top = (e.pageY - 10) + 'px';
          const statusClass = bar.has_error ? 'tt-status-err' : 'tt-status-ok';
          const statusText = bar.has_error ? 'Error' : 'Success';
          tooltip.innerHTML = `
            <div class="tt-method">@${bar.response_id} ${bar.method}</div>
            <div class="tt-row">Duration: ${fmtDuration(bar.duration_ms)}</div>
            <div class="tt-row">Tokens: ${bar.tokens !== null ? bar.tokens : 'N/A'}</div>
            <div class="tt-row">Offset: ${fmtDuration(bar.start_offset_ms)}</div>
            <div class="tt-row ${statusClass}">Status: ${statusText}</div>
          `;
        });
        rect.addEventListener('mouseout', () => {
          tooltip.style.display = 'none';
        });

        svg.appendChild(rect);

        // Duration label after bar
        const durLabel = document.createElementNS(ns, 'text');
        durLabel.setAttribute('x', x + w + 6);
        durLabel.setAttribute('y', y + barHeight / 2 + 4);
        durLabel.setAttribute('class', 'duration-label');
        const tokStr = bar.tokens !== null ? `[${bar.tokens}]` : '[-]';
        durLabel.textContent = `${fmtDuration(bar.duration_ms)}  ${tokStr}`;
        svg.appendChild(durLabel);
      });

      // Time axis
      const axisY = data.length * (barHeight + barGap) + topPad + 10;
      const axisLine = document.createElementNS(ns, 'line');
      axisLine.setAttribute('x1', labelWidth);
      axisLine.setAttribute('y1', axisY);
      axisLine.setAttribute('x2', labelWidth + chartWidth);
      axisLine.setAttribute('y2', axisY);
      axisLine.setAttribute('class', 'axis-line');
      svg.appendChild(axisLine);

      const tickCount = 5;
      for (let i = 0; i <= tickCount; i++) {
        const ms = Math.round((i / tickCount) * totalMs);
        const tx = labelWidth + (i / tickCount) * chartWidth;

        const tick = document.createElementNS(ns, 'line');
        tick.setAttribute('x1', tx);
        tick.setAttribute('y1', axisY - 3);
        tick.setAttribute('x2', tx);
        tick.setAttribute('y2', axisY + 3);
        tick.setAttribute('class', 'axis-line');
        svg.appendChild(tick);

        const tickLabel = document.createElementNS(ns, 'text');
        tickLabel.setAttribute('x', tx);
        tickLabel.setAttribute('y', axisY + 16);
        tickLabel.setAttribute('text-anchor', 'middle');
        tickLabel.setAttribute('class', 'axis-label');
        tickLabel.textContent = fmtDuration(ms);
        svg.appendChild(tickLabel);
      }
    }

    renderTrace(data);
  </script>
</body>
</html>
